name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify no secrets in source
        run: |
          if grep -rIl --exclude-dir=node_modules --exclude-dir=.git -E 'SESSION_SECRET=[0-9a-f]{32,}|ssh_password' .; then
            echo "::error::Ditemukan secret di dalam file yang ter-commit"
            exit 1
          fi
          echo "OK: tidak ada secret"
