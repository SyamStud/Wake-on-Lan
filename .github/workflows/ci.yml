name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify no secrets in committed source
        run: |
          FAILED=0
          if git ls-files -z | grep -zv '^\.github/workflows/ci\.yml$' | xargs -0 grep -InP '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|SESSION_SECRET=[0-9a-fA-F]{32,}|APP_PASSWORD=(?!ganti-dengan)|serverstb' 2>/dev/null; then
            echo "::error::Ditemukan secret di file yang ter-commit"
            FAILED=1
          else
            echo "OK: tidak ada secret di file yang ter-commit"
          fi
          exit $FAILED
